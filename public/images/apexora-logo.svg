<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" style="background: transparent;">
  <defs>
    <linearGradient id="wordmarkRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#e10600" />
    </linearGradient>
    <linearGradient id="wordmarkSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (Centered vertically at y=40, x=10 to x=70) -->
  <g transform="translate(10, 10)">
    <!-- Carbon Crest Background -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#10121a" stroke="#25293d" stroke-width="1.5"/>

    <!-- Left Wing Blade -->
    <path d="M 28 10 L 34 10 L 22 50 L 15 50 Z" fill="url(#wordmarkSilver)"/>

    <!-- Right Wing Blade -->
    <path d="M 31 10 L 37 10 L 45 50 L 38 50 Z" fill="url(#wordmarkRed)"/>

    <!-- Cross Winglet -->
    <polygon points="19,34 41,34 43,40 17,40" fill="#1b1e2c" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
    <polygon points="26,36 34,36 33,38 25,38" fill="url(#wordmarkRed)"/>

    <!-- Apex Red Dot -->
    <circle cx="30" cy="55" r="2" fill="#e10600"/>
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(85, 46)">
    <!-- "APEX" in high-impact red/silver -->
    <text x="0" y="0" fill="url(#wordmarkRed)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="1.5">
      APEX<tspan fill="#ffffff" font-weight="900" letter-spacing="2">ORA</tspan>
    </text>

    <!-- Subtitle Kicker -->
    <text x="2" y="16" fill="#64748b" font-family="monospace" font-size="8" font-weight="800" letter-spacing="3.2">
      FORMULA 1 DIGITAL COMMAND
    </text>
  </g>

  <!-- Far Right Racing Chevron Accent -->
  <g transform="translate(345, 26)">
    <polygon points="0,0 8,0 2,16 -6,16" fill="#e10600" opacity="0.9"/>
    <polygon points="10,0 18,0 12,16 4,16" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
