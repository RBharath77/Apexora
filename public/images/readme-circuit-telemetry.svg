<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260" style="background: transparent;">
  <defs>
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#12131c" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
    <filter id="carGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .blinking {
        animation: blinkCursor 1.2s infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#trackBg)" stroke="#232638" stroke-width="2"/>

  <!-- Top Circuit Header Bar -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="rgba(225, 6, 0, 0.16)" stroke="#e10600" stroke-width="1"/>
    <text x="80" y="16" fill="#e10600" font-family="monospace" font-size="11" font-weight="900" letter-spacing="1.5" text-anchor="middle">
      CIRCUIT TELEMETRY
    </text>
    <text x="175" y="17" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">
      LAS VEGAS STRIP CIRCUIT • LIVE SECTOR DELTAS
    </text>
  </g>

  <!-- 1. Road Asphalt Base (Wide dark track surface) -->
  <path id="f1CircuitLoop"
        d="M 210,190 L 350,190 C 390,190 425,175 425,140 C 425,110 400,85 360,85 C 320,85 290,115 250,115 C 220,115 195,85 160,85 C 120,85 80,100 80,135 L 80,160 C 80,180 100,190 125,190 Z"
        fill="none" stroke="#1e2233" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 2. Road Curbs / Edges -->
  <path d="M 210,190 L 350,190 C 390,190 425,175 425,140 C 425,110 400,85 360,85 C 320,85 290,115 250,115 C 220,115 195,85 160,85 C 120,85 80,100 80,135 L 80,160 C 80,180 100,190 125,190 Z"
        fill="none" stroke="#2d334d" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 3. Centerline Road Markings -->
  <path d="M 210,190 L 350,190 C 390,190 425,175 425,140 C 425,110 400,85 360,85 C 320,85 290,115 250,115 C 220,115 195,85 160,85 C 120,85 80,100 80,135 L 80,160 C 80,180 100,190 125,190 Z"
        fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 7" stroke-linejoin="round"/>

  <!-- 4. Sector 1 (Purple - S1: Start/Finish to Koval/Sands) -->
  <path d="M 210,190 L 350,190 C 390,190 425,175 425,140 C 425,110 400,85 360,85"
        fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>

  <!-- 5. Sector 2 (Green - S2: Sands Ave through Sphere chicane to The Strip) -->
  <path d="M 360,85 C 320,85 290,115 250,115 C 220,115 195,85 160,85 C 120,85 80,100 80,135"
        fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>

  <!-- 6. Sector 3 (Yellow - S3: The Strip straight & Harmon Ave back to Start/Finish) -->
  <path d="M 80,135 L 80,160 C 80,180 100,190 125,190 L 210,190"
        fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>

  <!-- Start / Finish Line Marker -->
  <line x1="210" y1="180" x2="210" y2="200" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="218" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">START/FINISH</text>

  <!-- Sector Apex Markers -->
  <g transform="translate(432, 132)">
    <circle r="7" fill="#1e2233" stroke="#c084fc" stroke-width="1.2"/>
    <text y="3" fill="#c084fc" font-family="monospace" font-size="8" font-weight="900" text-anchor="middle">S1</text>
  </g>
  <g transform="translate(250, 134)">
    <circle r="7" fill="#1e2233" stroke="#4ade80" stroke-width="1.2"/>
    <text y="3" fill="#4ade80" font-family="monospace" font-size="8" font-weight="900" text-anchor="middle">S2</text>
  </g>
  <g transform="translate(62, 135)">
    <circle r="7" fill="#1e2233" stroke="#facc15" stroke-width="1.2"/>
    <text y="3" fill="#facc15" font-family="monospace" font-size="8" font-weight="900" text-anchor="middle">S3</text>
  </g>

  <!-- Animated F1 Car Dot Traveling Along the Circuit Path -->
  <g filter="url(#carGlow)">
    <circle r="6" fill="#e10600">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#f1CircuitLoop"/>
      </animateMotion>
    </circle>
  </g>
  <!-- Secondary White Core for the Car -->
  <circle r="2.5" fill="#ffffff">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#f1CircuitLoop"/>
    </animateMotion>
  </circle>

  <!-- Right Side Telemetry Card Panels -->
  <g transform="translate(480, 48)">
    <!-- Sector Timing Table -->
    <rect x="0" y="0" width="385" height="180" rx="10" fill="#10121a" stroke="#232638" stroke-width="1"/>

    <!-- Row: Sector 1 (Purple - Fastest) -->
    <g transform="translate(20, 26)">
      <circle cx="6" cy="6" r="4" fill="#c084fc"/>
      <text x="22" y="10" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">SECTOR 1 (S1)</text>
      <text x="175" y="10" fill="#c084fc" font-family="monospace" font-size="13" font-weight="900">26.412s</text>
      <rect x="270" y="-3" width="85" height="20" rx="4" fill="rgba(192, 132, 252, 0.16)" stroke="#c084fc" stroke-width="0.8"/>
      <text x="312" y="11" fill="#c084fc" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">OVERALL FL</text>
    </g>

    <!-- Row: Sector 2 (Green - Personal Best) -->
    <g transform="translate(20, 58)">
      <circle cx="6" cy="6" r="4" fill="#4ade80"/>
      <text x="22" y="10" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">SECTOR 2 (S2)</text>
      <text x="175" y="10" fill="#4ade80" font-family="monospace" font-size="13" font-weight="900">37.108s</text>
      <rect x="270" y="-3" width="85" height="20" rx="4" fill="rgba(74, 222, 128, 0.14)" stroke="#4ade80" stroke-width="0.8"/>
      <text x="312" y="11" fill="#4ade80" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">PERSONAL</text>
    </g>

    <!-- Row: Sector 3 (Yellow) -->
    <g transform="translate(20, 90)">
      <circle cx="6" cy="6" r="4" fill="#facc15"/>
      <text x="22" y="10" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">SECTOR 3 (S3)</text>
      <text x="175" y="10" fill="#facc15" font-family="monospace" font-size="13" font-weight="900">24.234s</text>
      <rect x="270" y="-3" width="85" height="20" rx="4" fill="rgba(250, 204, 21, 0.12)" stroke="#facc15" stroke-width="0.8"/>
      <text x="312" y="11" fill="#facc15" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">IN BUFFER</text>
    </g>

    <line x1="20" y1="116" x2="365" y2="116" stroke="#232638" stroke-width="1"/>

    <!-- Total Lap Time Banner -->
    <g transform="translate(20, 142)">
      <text x="0" y="6" fill="#ffffff" font-family="monospace" font-size="11" font-weight="800">PROJECTED LAP</text>
      <text x="175" y="7" fill="#ffffff" font-family="monospace" font-size="18" font-weight="900">1:27.754</text>
      <rect x="270" y="-8" width="85" height="22" rx="4" fill="#e10600"/>
      <text x="312" y="7" fill="#ffffff" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle" class="blinking">P1 DELTA</text>
    </g>

    <!-- Speed Trap & G-Force Badges -->
    <g transform="translate(20, 168)">
      <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="9" font-weight="700">
        SPEED TRAP: 342.8 KM/H • LATERAL: +4.2G • TRACK GRIP: OPTIMAL
      </text>
    </g>
  </g>
</svg>
