<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260" style="background: transparent;">
  <defs>
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c12" />
      <stop offset="100%" stop-color="#141622" />
    </linearGradient>
    <linearGradient id="sector1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sector2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="sector3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="carGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes gPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .g-indicator {
        transform-origin: 790px 145px;
        animation: gPulse 1.8s ease-in-out infinite;
      }
      .blinking {
        animation: blinkCursor 1s infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#trackBg)" stroke="#232638" stroke-width="2"/>

  <!-- Top Circuit Header Bar -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="rgba(225, 6, 0, 0.16)" stroke="#e10600" stroke-width="1"/>
    <text x="80" y="16" fill="#e10600" font-family="monospace" font-size="11" font-weight="900" letter-spacing="1.5" text-anchor="middle">
      CIRCUIT TELEMETRY
    </text>
    <text x="175" y="17" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">
      LAS VEGAS STRIP CIRCUIT • SECTOR DELTAS
    </text>
  </g>

  <!-- Circuit Outline with Closed Loop Path -->
  <!-- Circuit loop coordinates centered in x:60 to x:480, y:70 to y:220 -->
  <path id="f1CircuitLoop"
        d="M 110,190 L 320,190 C 370,190 410,180 430,150 C 445,125 435,95 400,90 C 365,85 340,110 310,110 L 220,110 C 190,110 180,80 150,80 C 110,80 90,120 90,150 Z"
        fill="none" stroke="#25293d" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Circuit Center Line (White Road Markings) -->
  <path d="M 110,190 L 320,190 C 370,190 410,180 430,150 C 445,125 435,95 400,90 C 365,85 340,110 310,110 L 220,110 C 190,110 180,80 150,80 C 110,80 90,120 90,150 Z"
        fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 8" stroke-linejoin="round"/>

  <!-- Start / Finish Line -->
  <line x1="200" y1="180" x2="200" y2="200" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="218" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">START/FINISH</text>

  <!-- Sector 1, 2, 3 Color Indicators Along Track -->
  <path d="M 110,190 L 270,190" fill="none" stroke="url(#sector1)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 270,190 C 370,190 410,180 430,150 C 445,125 435,95 400,90" fill="none" stroke="url(#sector2)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 400,90 C 365,85 340,110 310,110 L 150,80 C 110,80 90,120 110,190" fill="none" stroke="url(#sector3)" stroke-width="4" stroke-linecap="round"/>

  <!-- Animated F1 Car Dot Traveling Along the Circuit Path -->
  <g filter="url(#carGlow)">
    <circle r="6" fill="#e10600">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#f1CircuitLoop"/>
      </animateMotion>
    </circle>
  </g>
  <!-- Secondary White Core for the Car -->
  <circle r="2.5" fill="#ffffff">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#f1CircuitLoop"/>
    </animateMotion>
  </circle>

  <!-- Right Side Telemetry Card Panels -->
  <g transform="translate(480, 50)">
    <!-- Sector Timing Table -->
    <rect x="0" y="0" width="375" height="175" rx="10" fill="rgba(10, 11, 16, 0.75)" stroke="#232638" stroke-width="1"/>

    <!-- Row: Sector 1 (Purple - Fastest) -->
    <g transform="translate(20, 25)">
      <circle cx="6" cy="6" r="4" fill="#c084fc"/>
      <text x="22" y="10" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">SECTOR 1 (S1)</text>
      <text x="180" y="10" fill="#c084fc" font-family="monospace" font-size="13" font-weight="900">26.412s</text>
      <rect x="270" y="-3" width="70" height="18" rx="3" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" stroke-width="0.7"/>
      <text x="305" y="10" fill="#c084fc" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">OVERALL FL</text>
    </g>

    <!-- Row: Sector 2 (Green - Personal Best) -->
    <g transform="translate(20, 55)">
      <circle cx="6" cy="6" r="4" fill="#4ade80"/>
      <text x="22" y="10" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">SECTOR 2 (S2)</text>
      <text x="180" y="10" fill="#4ade80" font-family="monospace" font-size="13" font-weight="900">37.108s</text>
      <rect x="270" y="-3" width="70" height="18" rx="3" fill="rgba(74, 222, 128, 0.15)" stroke="#4ade80" stroke-width="0.7"/>
      <text x="305" y="10" fill="#4ade80" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">PERSONAL</text>
    </g>

    <!-- Row: Sector 3 (Yellow) -->
    <g transform="translate(20, 85)">
      <circle cx="6" cy="6" r="4" fill="#facc15"/>
      <text x="22" y="10" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">SECTOR 3 (S3)</text>
      <text x="180" y="10" fill="#facc15" font-family="monospace" font-size="13" font-weight="900">24.234s</text>
      <rect x="270" y="-3" width="70" height="18" rx="3" fill="rgba(250, 204, 21, 0.12)" stroke="#facc15" stroke-width="0.7"/>
      <text x="305" y="10" fill="#facc15" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">IN BUFFER</text>
    </g>

    <line x1="20" y1="110" x2="355" y2="110" stroke="#232638" stroke-width="1"/>

    <!-- Total Lap Time Banner -->
    <g transform="translate(20, 138)">
      <text x="0" y="6" fill="#ffffff" font-family="monospace" font-size="11" font-weight="800">PROJECTED LAP</text>
      <text x="180" y="7" fill="#ffffff" font-family="monospace" font-size="18" font-weight="900">1:27.754</text>
      <rect x="270" y="-8" width="70" height="22" rx="4" fill="#e10600"/>
      <text x="305" y="7" fill="#ffffff" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle" class="blinking">P1 DELTA</text>
    </g>

    <!-- Speed Trap & G-Force Badges -->
    <g transform="translate(20, 162)">
      <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="9" font-weight="700">
        SPEED TRAP: 342.8 KM/H • LATERAL: +4.2G • TRACK GRIP: OPTIMAL
      </text>
    </g>
  </g>
</svg>

